<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audio Tagger">
<title>Audio Tagger Studio</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #151922;
    --border: #262c3a;
    --accent: #1db954;
    --text: #f3f4f6;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: env(safe-area-inset-top, 20px) 18px 40px 18px; }
  .header { text-align: center; margin: 14px 0 16px 0; }
  .header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.4px; }
  .badge { display: inline-block; background: rgba(29,185,84,0.15); color: var(--accent); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
  .mode-switch { display: flex; background: #151922; border: 1px solid var(--border); border-radius: 11px; padding: 4px; margin-bottom: 14px; }
  .mode-btn { flex: 1; text-align: center; padding: 10px 6px; font-size: 12px; font-weight: 700; border-radius: 8px; color: var(--muted); cursor: pointer; transition: 0.15s; }
  .mode-btn.active { background: var(--accent); color: #000; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; display: block; }
  .btn-pick { width: 100%; background: #1e2433; border: 1px dashed #3f475a; color: #e5e7eb; padding: 13px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-pick.loaded { border-style: solid; border-color: var(--accent); color: var(--accent); background: rgba(29,185,84,0.08); }
  .art-row { display: flex; gap: 12px; align-items: center; }
  #art-preview { width: 76px; height: 76px; border-radius: 10px; background: #08090c; border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; display: none; }
  .art-buttons { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  input[type="text"] { width: 100%; background: #08090c; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 9px; font-size: 15px; margin-bottom: 10px; outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="file"] { display: none; }
  .btn-main { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 11px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 4px; }
  .btn-main:disabled { background: #262c3a; color: #6b7280; cursor: not-allowed; }
  .btn-secondary { width: 100%; background: #232938; color: #fff; border: 1px solid var(--border); padding: 13px; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; display: none; text-align: center; text-decoration: none; }
  .progress-wrap { width: 100%; height: 6px; background: #08090c; border-radius: 4px; overflow: hidden; margin-top: 12px; display: none; }
  .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
  #status { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; font-weight: 500; }
</style>
</head>
<body>

<div class="header">
  <h1>Audio Tagger <span class="badge" id="mode-badge">Gapless MP3</span></h1>
</div>

<div class="mode-switch">
  <div class="mode-btn active" id="mode-mp3" onclick="setMode('mp3')">320kbps MP3 (Spotify Gapless)</div>
  <div class="mode-btn" id="mode-wav" onclick="setMode('wav')">Lossless WAV (0ms Delay)</div>
</div>

<div class="card">
  <span class="label">1. Audio File (.WAV)</span>
  <div class="btn-pick" id="wav-btn" onclick="document.getElementById('wav-in').click()">Select .WAV from Files</div>
  <input type="file" id="wav-in" accept=".wav,audio/wav,audio/x-wav,audio/*">
</div>

<div class="card">
  <span class="label">2. Cover Artwork</span>
  <div class="art-row">
    <img id="art-preview" alt="Cover">
    <div class="art-buttons">
      <div class="btn-pick" id="photo-btn" onclick="document.getElementById('photo-in').click()">Pick from Photos</div>
      <div class="btn-pick" id="file-art-btn" onclick="document.getElementById('file-art-in').click()">Pick from Files</div>
    </div>
  </div>
  <input type="file" id="photo-in" accept="image/*">
  <input type="file" id="file-art-in">
</div>

<div class="card">
  <span class="label">3. Song Details</span>
  <input type="text" id="title-in" placeholder="Song Title">
  <input type="text" id="artist-in" placeholder="Artist Name">
  <input type="text" id="album-in" placeholder="Album / EP Name">
  
  <button class="btn-main" id="encode-btn" onclick="runTagger()">Convert & Tag (Gapless MP3)</button>
  <button class="btn-main" id="share-btn" style="display:none; background:#fff; margin-top:10px;" onclick="shareToFiles()">Save to Files</button>
  <a class="btn-secondary" id="dl-btn">Direct Download</a>

  <div class="progress-wrap" id="prog-wrap">
    <div class="progress-bar" id="prog-bar"></div>
  </div>
  <div id="status">Ready</div>
</div>

<script>
let exportMode = 'mp3';
let wavBuffer = null;
let jpegBytes = null;
let baseName = "Track";
let finalOutFile = null;
let finalOutUrl = null;

function setMode(m) {
  exportMode = m;
  document.getElementById('mode-mp3').classList.toggle('active', m === 'mp3');
  document.getElementById('mode-wav').classList.toggle('active', m === 'wav');
  document.getElementById('mode-badge').textContent = m === 'mp3' ? 'Gapless MP3' : 'Lossless WAV';
  document.getElementById('encode-btn').textContent = m === 'mp3' ? 'Convert & Tag (Gapless MP3)' : 'Tag Lossless WAV (Instant)';
  resetOutputs();
}

document.getElementById('wav-in').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  baseName = file.name.replace(/\.[^/.]+$/, "");
  const btn = document.getElementById('wav-btn');
  btn.textContent = "Loading " + file.name + "...";
  wavBuffer = await file.arrayBuffer();
  btn.textContent = "✓ " + file.name;
  btn.classList.add('loaded');
  if (!document.getElementById('title-in').value) {
    document.getElementById('title-in').value = baseName;
  }
  resetOutputs();
});

async function handleArtwork(file, btnId) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const maxDim = 1000;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim) {
      if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
      else { w = Math.round(w * (maxDim / h)); h = maxDim; }
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const preview = document.getElementById('art-preview');
    preview.src = dataUrl;
    preview.style.display = 'block';

    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    jpegBytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) jpegBytes[i] = bin.charCodeAt(i);

    document.getElementById('photo-btn').classList.remove('loaded');
    document.getElementById('file-art-btn').classList.remove('loaded');
    const activeBtn = document.getElementById(btnId);
    activeBtn.textContent = "✓ " + file.name;
    activeBtn.classList.add('loaded');
    resetOutputs();
  };
  img.src = url;
}

document.getElementById('photo-in').addEventListener('change', (e) => handleArtwork(e.target.files[0], 'photo-btn'));
document.getElementById('file-art-in').addEventListener('change', (e) => handleArtwork(e.target.files[0], 'file-art-btn'));

function resetOutputs() {
  document.getElementById('share-btn').style.display = 'none';
  document.getElementById('dl-btn').style.display = 'none';
}

function makeUtf16Frame(id, text) {
  if (!text) return null;
  const strBytes = new Uint8Array(2 + text.length * 2);
  strBytes[0] = 0xFF;
  strBytes[1] = 0xFE;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    strBytes[2 + i * 2] = code & 0xFF;
    strBytes[2 + i * 2 + 1] = (code >> 8) & 0xFF;
  }
  const pLen = 1 + strBytes.length;
  const frame = new Uint8Array(10 + pLen);
  frame.set([id.charCodeAt(0), id.charCodeAt(1), id.charCodeAt(2), id.charCodeAt(3)], 0);
  frame.set([(pLen >>> 24) & 0xFF, (pLen >>> 16) & 0xFF, (pLen >>> 8) & 0xFF, pLen & 0xFF], 4);
  frame[10] = 1;
  frame.set(strBytes, 11);
  return frame;
}

// Builds Apple/Spotify iTunSMPB Gapless Playback COMM Frame
function makeGaplessFrame(encDelay, encPadding, totalSamples) {
  const hex8 = (n) => Math.max(0, n >>> 0).toString(16).toUpperCase().padStart(8, '0');
  const hex16 = (n) => Math.max(0, n).toString(16).toUpperCase().padStart(16, '0');
  const valStr = ` 00000000 ${hex8(encDelay)} ${hex8(encPadding)} ${hex16(totalSamples)} 00000000 00000000 00000000 00000000 00000000 00000000 00000000 00000000`;
  
  const desc = [105, 84, 117, 110, 83, 77, 80, 66, 0]; // "iTunSMPB\0"
  const valBytes = new TextEncoder().encode(valStr);
  const pLen = 1 + 3 + desc.length + valBytes.length;
  
  const frame = new Uint8Array(10 + pLen);
  frame.set([67, 79, 77, 77], 0); // "COMM"
  frame.set([(pLen >>> 24) & 0xFF, (pLen >>> 16) & 0xFF, (pLen >>> 8) & 0xFF, pLen & 0xFF], 4);
  frame[10] = 0; // ISO-8859-1
  frame.set([101, 110, 103], 11); // "eng"
  frame.set(desc, 14);
  frame.set(valBytes, 14 + desc.length);
  return frame;
}

// Trim excess silent flush frames added by lamejs at the end of the track
function trimMp3FlushFrames(mp3Bytes, targetFrames) {
  let count = 0;
  let offset = 0;
  const len = mp3Bytes.length;
  while (offset + 4 <= len && count < targetFrames) {
    if (mp3Bytes[offset] !== 0xFF || (mp3Bytes[offset + 1] & 0xE0) !== 0xE0) break;
    const srIdx = (mp3Bytes[offset + 2] >> 2) & 0x03;
    const pad = (mp3Bytes[offset + 2] >> 1) & 0x01;
    const srMap = [44100, 48000, 32000];
    const sr = srMap[srIdx] || 44100;
    const frameSize = Math.floor((144 * 320000) / sr) + pad;
    if (frameSize <= 0 || offset + frameSize > len) break;
    offset += frameSize;
    count++;
  }
  return offset > 0 ? mp3Bytes.subarray(0, offset) : mp3Bytes;
}

function buildId3v2Tag(extraFrames = []) {
  const title = document.getElementById('title-in').value.trim();
  const artist = document.getElementById('artist-in').value.trim();
  const album = document.getElementById('album-in').value.trim();

  const frames = [];
  const fTitle = makeUtf16Frame("TIT2", title); if (fTitle) frames.push(fTitle);
  const fArtist = makeUtf16Frame("TPE1", artist); if (fArtist) frames.push(fArtist);
  const fAlbum = makeUtf16Frame("TALB", album); if (fAlbum) frames.push(fAlbum);
  for (const ef of extraFrames) if (ef) frames.push(ef);

  if (jpegBytes) {
    const mime = [105, 109, 97, 103, 101, 47, 106, 112, 101, 103, 0];
    const pLen = 1 + mime.length + 2 + jpegBytes.length;
    const apic = new Uint8Array(10 + pLen);
    apic.set([65, 80, 73, 67], 0);
    apic.set([(pLen >>> 24) & 0xFF, (pLen >>> 16) & 0xFF, (pLen >>> 8) & 0xFF, pLen & 0xFF], 4);
    apic[10] = 0;
    apic.set(mime, 11);
    apic[11 + mime.length] = 3;
    apic[12 + mime.length] = 0;
    apic.set(jpegBytes, 13 + mime.length);
    frames.push(apic);
  }

  let fTotal = 0;
  for (const f of frames) fTotal += f.length;

  const id3 = new Uint8Array(10 + fTotal);
  id3.set([73, 68, 51, 3, 0, 0, (fTotal >> 21) & 0x7F, (fTotal >> 14) & 0x7F, (fTotal >> 7) & 0x7F, fTotal & 0x7F], 0);
  let offset = 10;
  for (const f of frames) { id3.set(f, offset); offset += f.length; }
  return id3;
}

const workerCode = `
importScripts('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.all.min.js');
self.onmessage = function(e) {
  const { left, right, sr, ch } = e.data;
  const enc = new lamejs.Mp3Encoder(ch, sr, 320);
  const chunks = [];
  const len = left.length;
  const block = 11520;
  let lastPct = 0;

  for (let i = 0; i < len; i += block) {
    const lc = left.subarray(i, i + block);
    const buf = ch === 1 ? enc.encodeBuffer(lc) : enc.encodeBuffer(lc, right.subarray(i, i + block));
    if (buf.length > 0) chunks.push(new Uint8Array(buf));
    const pct = Math.round((i / len) * 100);
    if (pct >= lastPct + 5) {
      lastPct = pct;
      self.postMessage({ type: 'prog', pct });
    }
  }
  const flush = enc.flush();
  if (flush.length > 0) chunks.push(new Uint8Array(flush));

  let total = 0;
  for (const c of chunks) total += c.length;
  const mp3 = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { mp3.set(c, off); off += c.length; }

  self.postMessage({ type: 'done', mp3 }, [mp3.buffer]);
};
`;

async function runTagger() {
  if (!wavBuffer) { alert("Please select a WAV file first."); return; }
  const btn = document.getElementById('encode-btn');
  const status = document.getElementById('status');
  const progWrap = document.getElementById('prog-wrap');
  const progBar = document.getElementById('prog-bar');
  const title = document.getElementById('title-in').value.trim();

  btn.disabled = true;
  resetOutputs();

  try {
    if (exportMode === 'wav') {
      // Instant Lossless WAV Tagging (0ms Delay)
      status.textContent = "Injecting ID3 chunk into Lossless WAV...";
      const srcBytes = new Uint8Array(wavBuffer);
      const id3Tag = buildId3v2Tag();
      const cLen = id3Tag.length;
      const padByte = cLen % 2 !== 0 ? 1 : 0;
      const id3Chunk = new Uint8Array(8 + cLen + padByte);
      id3Chunk.set([105, 100, 51, 32], 0); // "id3 "
      id3Chunk.set([cLen & 0xFF, (cLen >>> 8) & 0xFF, (cLen >>> 16) & 0xFF, (cLen >>> 24) & 0xFF], 4);
      id3Chunk.set(id3Tag, 8);

      const rawBody = srcBytes.subarray(8);
      const totalRiffLen = rawBody.length + id3Chunk.length;
      const outWav = new Uint8Array(8 + totalRiffLen);
      outWav.set([82, 73, 70, 70], 0); // "RIFF"
      outWav.set([totalRiffLen & 0xFF, (totalRiffLen >>> 8) & 0xFF, (totalRiffLen >>> 16) & 0xFF, (totalRiffLen >>> 24) & 0xFF], 4);
      outWav.set(rawBody, 8);
      outWav.set(id3Chunk, 8 + rawBody.length);

      finishExport(outWav, (title || baseName) + ".wav", "audio/wav");
      return;
    }

    // Gapless 320kbps MP3 Mode
    progWrap.style.display = 'block';
    progBar.style.width = '5%';
    status.textContent = "Decoding WAV audio...";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await audioCtx.decodeAudioData(wavBuffer.slice(0));
    const ch = decoded.numberOfChannels;
    const sr = decoded.sampleRate;
    const len = decoded.length;

    const leftF = decoded.getChannelData(0);
    const left16 = new Int16Array(len);
    for (let i = 0; i < len; i++) {
      const s = leftF[i];
      left16[i] = s < 0 ? (s < -1 ? -32768 : s * 32768) : (s > 1 ? 32767 : s * 32767);
    }

    let right16 = null;
    if (ch > 1) {
      const rightF = decoded.getChannelData(1);
      right16 = new Int16Array(len);
      for (let i = 0; i < len; i++) {
        const s = rightF[i];
        right16[i] = s < 0 ? (s < -1 ? -32768 : s * 32768) : (s > 1 ? 32767 : s * 32767);
      }
    }

    status.textContent = "Encoding Gapless 320kbps MP3 (0%)...";
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(workerBlob));

    const rawMp3Bytes = await new Promise((resolve, reject) => {
      worker.onmessage = (e) => {
        if (e.data.type === 'prog') {
          progBar.style.width = e.data.pct + '%';
          status.textContent = "Encoding Gapless 320kbps MP3 (" + e.data.pct + "%)...";
        } else if (e.data.type === 'done') {
          worker.terminate();
          resolve(e.data.mp3);
        }
      };
      worker.onerror = (err) => { worker.terminate(); reject(err); };
      const transfers = [left16.buffer];
      if (right16) transfers.push(right16.buffer);
      worker.postMessage({ left: left16, right: right16, sr, ch }, transfers);
    });

    status.textContent = "Applying Gapless Transition Trim & Tags...";
    progBar.style.width = '100%';

    // Calculate exact gapless parameters & strip extra silent flush frames
    const encDelay = 576;
    const samplesPerFrame = sr >= 32000 ? 1152 : 576;
    const exactFramesNeeded = Math.ceil((len + encDelay) / samplesPerFrame);
    const trimmedMp3 = trimMp3FlushFrames(rawMp3Bytes, exactFramesNeeded);
    const encPadding = Math.max(0, (exactFramesNeeded * samplesPerFrame) - len - encDelay);

    const gaplessFrame = makeGaplessFrame(encDelay, encPadding, len);
    const id3 = buildId3v2Tag([gaplessFrame]);

    const out = new Uint8Array(id3.length + trimmedMp3.length);
    out.set(id3, 0);
    out.set(trimmedMp3, id3.length);

    finishExport(out, (title || baseName) + ".mp3", "audio/mpeg");
  } catch (err) {
    status.textContent = "Error: " + err.message;
    btn.disabled = false;
  }
}

function finishExport(byteArray, outName, mimeType) {
  const blob = new Blob([byteArray], { type: mimeType });
  finalOutFile = new File([blob], outName, { type: mimeType });

  if (finalOutUrl) URL.revokeObjectURL(finalOutUrl);
  finalOutUrl = URL.createObjectURL(blob);

  const dlBtn = document.getElementById('dl-btn');
  dlBtn.href = finalOutUrl;
  dlBtn.download = outName;
  dlBtn.textContent = "Direct Download (" + outName + ")";
  dlBtn.style.display = 'block';

  document.getElementById('share-btn').style.display = 'block';
  document.getElementById('status').textContent = "Done! Tap 'Save to Files' below.";
  document.getElementById('encode-btn').disabled = false;
}

async function shareToFiles() {
  if (!finalOutFile) return;
  if (navigator.canShare && navigator.canShare({ files: [finalOutFile] })) {
    try {
      await navigator.share({ files: [finalOutFile], title: finalOutFile.name });
    } catch (e) {}
  } else {
    document.getElementById('dl-btn').click();
  }
}
</script>
</body>
</html>
